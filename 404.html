<!DOCTYPE html>
<html lang="en-NG" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Page Not Found | Benjamin Chukwukadibia
    </title>

    <meta
        name="robots"
        content="noindex, follow">

    <meta
        name="theme-color"
        content="#0F172A">

    <!-- ==========================================
         Favicons
    ========================================== -->

    <link
        rel="icon"
        href="favicon/favicon.ico"
        sizes="any">

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="favicon/favicon-32x32.png">

    <link
        rel="apple-touch-icon"
        href="favicon/apple-touch-icon.png">

    <link
        rel="manifest"
        href="site.webmanifest">

    <!-- ==========================================
         Fonts
    ========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- ==========================================
         CSS

         Minimal set for a standalone error page - no
         nav/header/footer partials, since this page has
         no site chrome, just the foundation, container,
         buttons (for the "Back home" link) and this
         page's own styles.
    ========================================== -->

    <link
        rel="stylesheet"
        href="assets/css/foundation/tokens.css">

    <link
        rel="stylesheet"
        href="assets/css/foundation/reset.css">

    <link
        rel="stylesheet"
        href="assets/css/foundation/typography.css">

    <link
        rel="stylesheet"
        href="assets/css/foundation/base.css">

    <link
        rel="stylesheet"
        href="assets/css/layout/container.css">

    <link
        rel="stylesheet"
        href="assets/css/components/buttons.css">

    <link
        rel="stylesheet"
        href="assets/css/pages/error-404.css">

</head>

<body>

    <main class="error-404">

        <div class="container">

            <p class="error-404-code">
                404
            </p>

            <h1 class="error-404-title">
                Page Not Found
            </h1>

            <p class="error-404-message">
                The page you're looking for doesn't exist, may have
                been moved, or the link might be outdated.
            </p>

            <div class="error-404-actions">

                <a
                    href="/"
                    class="btn btn-primary">
                    Back to Homepage
                </a>

                <a
                    href="/#contact"
                    class="btn btn-secondary">
                    Contact Me
                </a>

            </div>

        </div>

    </main>

</body>

</html>
